# Curated catalog of mridata.org datasets.
#
# Each [[dataset]] entry is downloaded as an ISMRMRD .h5 from
#   https://mridata.org/download/{uuid}
#
# Fields mirror `DatasetEntry`. `id` is the mridata UUID. Unknown attributes may
# be omitted. `approx_size_bytes` is a rough hint used by the `max_bytes` guard;
# it does not need to be exact. To add datasets, copy a UUID from the dataset's
# mridata.org page and fill in what you know.
#
# NOTE: curated entries are always surfaced even when a live index is available
# (the live scrape has no size metadata). Keep `acquisition_dim` accurate — the
# test suite prefers 2D (acquisition_dim = 2) entries for reconstruction.

[[dataset]]
